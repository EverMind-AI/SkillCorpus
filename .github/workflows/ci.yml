name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-gates:
    name: repository gates
    runs-on: ubuntu-latest
    steps:
      # Full history is required by scripts/check_file_sizes.py.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements/plugins.txt
      - run: make check-repo
      - run: python -m pytest -q scripts/tests

  core:
    name: core tests and package (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - run: make install-ci
      - run: make test
      - if: matrix.python == '3.12'
        run: make package
      - name: Smoke-test the installed wheel outside the checkout
        if: matrix.python == '3.12'
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c 'import skillcorpus; import skillcorpus.core.store; from importlib.metadata import version; assert skillcorpus.__version__ == version("skillcorpus")'

  required:
    name: CI required
    if: always()
    needs: [repository-gates, core]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to succeed
        env:
          GATES: ${{ needs.repository-gates.result }}
          CORE: ${{ needs.core.result }}
        run: test "$GATES" = success && test "$CORE" = success
