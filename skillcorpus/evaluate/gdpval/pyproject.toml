[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gdpval-grader"
version = "0.1.0"
description = "Standalone LLM-judge grader for GDPval deliverables (rubric scoring)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
]

[project.optional-dependencies]
# Deliverable reading — strongly recommended (see README for coverage details).
artifacts = [
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "pdf2image>=1.16.0",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.23.0",
]
# Load task rubrics by id from the HuggingFace openai/gdpval dataset.
hf = [
    "datasets>=2.14.0",
]

[project.scripts]
gdpval-grader = "gdpval_grader.cli:main"

[tool.setuptools]
packages = ["gdpval_grader"]

[tool.setuptools.package-data]
gdpval_grader = ["meta_prompts/*.json"]
