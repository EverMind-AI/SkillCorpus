[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skillrep"
version = "0.1.0"
description = "Representation modules and analyses for agent skill retrieval"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "transformers>=4.56", "numpy>=1.24", "scipy>=1.10"]

[tool.setuptools]
packages = ["skillrep"]
