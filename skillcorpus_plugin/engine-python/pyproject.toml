[project]
name = "skillsearch"
version = "0.2.0"
description = "Skill retrieval for agent hosts — one engine, five host adapters."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "EverMind AI" }]
keywords = ["agent", "skills", "retrieval", "rrf", "bm25", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

# Host adapters enable public marketplace sources by default, so the HTTP
# client is a runtime dependency rather than an optional surprise at startup.
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
hub = []
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/EverMind-AI/SkillCorpus/tree/main/skillcorpus_plugin"
Source = "https://github.com/EverMind-AI/SkillCorpus/tree/main/skillcorpus_plugin"
Issues = "https://github.com/EverMind-AI/SkillCorpus/issues"

[project.scripts]
skillsearch-serve = "skillsearch.adapters.http_server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skillsearch*"]

[tool.setuptools.package-data]
skillsearch = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "TRY", "BLE", "S"]
ignore = [
    # Retrieval never raises: it runs before the model answers the user,
    # so every stage catches broadly on purpose and degrades to fewer
    # skills. Each such handler logs what it swallowed.
    "BLE001",
    # Same reason, at the two places where even logging could raise.
    "S110",
    # The message belongs where a reader will see it, and these
    # exceptions are read in logs rather than caught by type.
    "TRY003",
    "TRY400",
    # This package builds no SQL. Every hit is a prompt that happens to
    # contain the word "select".
    "S608",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on shapes and construct deliberately broken inputs.
"tests/*" = ["S101", "S105", "S106", "TRY002", "TRY301", "BLE001"]
