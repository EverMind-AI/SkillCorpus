# 源注册表 (公开默认 = demo) — fetch.py / refresh_loop.py 默认读这个文件。
#
# 这是**公开发布版**: 只列少数几个可靠的 permissive 公开仓, 让拿到代码的用户
# 能端到端跑通整条 producer 流程 (fetch → ingest → quality → classify → embed
# → store → export), 自建一个小库验证。
#
# 完整生产注册表 (62 源, 6 type) 在 sources.full.yaml —— 已被 .gitignore 排除,
# 不随公开发布提供。生产端跑全量:
#   python -m skill_library.fetch --config skill_library/sources.full.yaml
#
# data/ 产物 (index.db / skills/ / mass_library.db) 也被 .gitignore 排除, 用户
# 跑完得到的是从下面这几个源自建的小库, 不是成品语料。
#
# 用法 (默认即 demo):
#   python -m skill_library.fetch
#   python -m skill_library.scripts.refresh_loop --force
#
# 全部 git_clone 类型 (确定、快、无动态展开), 都是 OSI-permissive 公开仓。

defaults:
  rescan_quality_after: true
  rescan_dedup_after: false
  export_after: true
  parallel_clones: 4

sources:
  - name: anthropics/skills
    repo: anthropics/skills
    type: git_clone
    pull_cadence: weekly
    source_label: anthropics/skills        # 官方 Agent Skills 仓 (锚点)

  - name: vercel-labs/skills
    repo: vercel-labs/skills
    type: git_clone
    pull_cadence: weekly
    source_label: vercel-labs/skills        # Vercel 官方 dogfood

  - name: addyosmani/agent-skills
    repo: addyosmani/agent-skills
    type: git_clone
    pull_cadence: monthly
    source_label: addyosmani/agent-skills   # 知名前端工程师, TDD/调试/CI

  - name: K-Dense-AI/scientific-agent-skills
    repo: K-Dense-AI/scientific-agent-skills
    type: git_clone
    pull_cadence: monthly
    source_label: K-Dense-AI/scientific-agent-skills  # 学术: 生物/化学/医学/工程
