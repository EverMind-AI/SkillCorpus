[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skillcorpus"
version = "0.1.0"
description = "SkillCorpus — an open pipeline that builds a corpus of agent skills"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "numpy",
    "click",
    "faiss-cpu",
    "sqlite-vec",
    "openai",
    "pyarrow",
]

[project.optional-dependencies]
# reportlab is only used by tests/test_e2e.py (PDF skill fixture)
dev = ["pytest", "reportlab"]

# Flat nested layout: the importable package is <repo>/skillcorpus/.
# Keeping the package name `skillcorpus` (not renamed) so existing
# `python -m skillcorpus.*` invocations and absolute imports keep working.
[tool.setuptools.packages.find]
include = ["skillcorpus*"]

[tool.setuptools.package-data]
# license_safe_sources.json is intentionally NOT shipped: it is a private,
# generated whitelist (see skillcorpus/.gitignore) regenerated at deploy.
skillcorpus = ["config.yaml", "sources.yaml"]
