[project]
name = "skillsearch"
version = "0.1.0"
description = "Skill retrieval for agent hosts — one engine, three adapters."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
skillsearch-serve = "skillsearch.adapters.http_server:main"

# Raven finds pip-installed plugins through this group, then reads
# raven-plugin.toml from inside the named package.
[project.entry-points."raven.plugins"]
skillsearch = "skillsearch"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skillsearch*"]

[tool.setuptools.package-data]
skillsearch = ["raven-plugin.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
