# Both implementations, each in its own job: a change to one must not be
# able to break the other's signal, and neither needs the other's toolchain
# installed to run.
#
# This repository is hosted on GitLab, so this file is the one that runs.
# A `.github/workflows/` file would be inert here — kept alongside only for
# a mirror, and the two must be changed together.

stages:
  - test

.python:
  stage: test
  image: python:${PY_VERSION}-slim
  before_script:
    - cd python
    - pip install --quiet -e '.[dev,hub]'

python:
  extends: .python
  parallel:
    matrix:
      - PY_VERSION: ['3.11', '3.12', '3.13']
  script:
    - ruff check skillsearch tests
    - ruff format --check skillsearch tests
    - pytest -q

# The package declares no required dependency; this job is what proves it.
# Installed bare, the local-pipeline tests must still pass, which fails the
# moment an unconditional `import httpx` reaches module scope.
python-no-extras:
  stage: test
  image: python:3.12-slim
  script:
    - cd python
    - pip install --quiet -e . pytest pytest-asyncio
    - pytest -q --ignore=tests/test_hub_client.py

# The TypeScript package is a DeepSeek Harness workspace member: its plugin
# entry and tsconfig references resolve only inside a harness checkout, so
# this job checks what is checkable standalone — that the pipeline modules
# parse, that their pure logic behaves, and that the values and prompts
# shared with the Python side still match it exactly.
typescript:
  stage: test
  image: node:22-slim
  script:
    - cd typescript
    - npx --yes tsx --test tests/parity.test.ts

# The Hermes plugin drives the engine through the host's provider contract.
# Its own tests import the engine from `python/`, so both live in one job.
hermes-plugin:
  stage: test
  image: python:3.12-slim
  script:
    - pip install --quiet -e './python[dev,hub]'
    - pytest hermes/tests -q

# The OpenClaw plugin bundles the TypeScript engine; `ci` typechecks it
# against the host types it copied, runs the suite, and builds the bundle.
openclaw-plugin:
  stage: test
  image: node:22-slim
  script:
    - cd openclaw
    - npm install --no-audit --no-fund
    - npm run ci
